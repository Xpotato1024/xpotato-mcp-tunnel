name: Cross-platform checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/windows-tunnel-cli, feat/setup-once-core]
permissions:
  contents: read
jobs:
  go-tests:
    name: Go / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: xpotato-tunnel.exe
            platform: windows-amd64
          - os: ubuntu-latest
            binary: xpotato-tunnel
            platform: linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test -v -count=1 ./...
        env:
          XPOTATO_RUNTIME_SMOKE: '1'
      - run: go vet ./...
      - name: Race checks for update and launch fixtures
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./internal/atomicfile ./internal/core ./internal/managed ./internal/processctrl ./cmd/xpotato-tunnel
        env:
          XPOTATO_RUNTIME_SMOKE: '0'
      - name: Package regression tests
        run: python -m unittest discover -s test -p "test_*.py" -v
      - name: Build review package (no publishing)
        id: package
        shell: bash
        run: |
          mkdir -p dist/rebuild
          go build -trimpath -o dist/${{ matrix.binary }} ./cmd/xpotato-tunnel
          go build -trimpath -o dist/rebuild/${{ matrix.binary }} ./cmd/xpotato-tunnel
          cmp dist/${{ matrix.binary }} dist/rebuild/${{ matrix.binary }}
          python scripts/package-review.py --binary dist/${{ matrix.binary }} --output dist/package --platform ${{ matrix.platform }}
          python scripts/package-review.py --binary dist/${{ matrix.binary }} --output dist/release --platform ${{ matrix.platform }} --release
          python scripts/package-review.py --binary dist/${{ matrix.binary }} --output dist/release-repeat --platform ${{ matrix.platform }} --release
          if [[ '${{ matrix.platform }}' == windows-* ]]; then
            cmp dist/release/*.zip dist/release-repeat/*.zip
          else
            cmp dist/release/*.tar.gz dist/release-repeat/*.tar.gz
          fi
      - name: Windows quickstart regression checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/quickstart.test.ps1 -BinaryPath ./dist/xpotato-tunnel.exe
      - name: Build pinned Windows installer candidate (no publishing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/fetch-installer-tool.py --output dist/nsis-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Pinned compiler acquisition failed' }
          $pin = Get-Content installer/nsis-toolchain.json -Raw | ConvertFrom-Json
          $tool = "dist/nsis-toolchain/nsis-$($pin.version)"
          python scripts/package-installer.py --content dist/package/content --output dist/installer --makensis "$tool/makensis.exe" --compiler-sha256 $pin.compilerSHA256 --nsis-license "$tool/COPYING"
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Isolated Windows installer lifecycle (no credentials)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = Get-Content dist/package/content/build-info.json -Raw | ConvertFrom-Json
          ./test/installer.test.ps1 -InstallerPath "dist/installer/xpotato-tunnel-$($info.version)-windows-amd64-setup.exe" -Version $info.version
      - name: Upload installer review candidate (no publishing)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/installer/*-setup.exe
            dist/installer/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Corresponding source candidate and reproducibility (no publishing)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/package-source.py --output dist/source
          python scripts/package-source.py --output dist/source-repeat
          cmp dist/source/*.tar.gz dist/source-repeat/*.tar.gz
      - name: Upload corresponding source candidate (no publishing)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corresponding-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/source/*.tar.gz
            dist/source/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Windows PowerShell 5.1 quickstart regression checks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/quickstart.test.ps1 -BinaryPath ./dist/xpotato-tunnel.exe
      - name: Windows package checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location dist/package/content
          foreach ($line in Get-Content -LiteralPath ./SHA256SUMS) {
            if ($line -notmatch '^([0-9a-fA-F]{64}) [ *](.+)$') { throw 'Invalid SHA256SUMS' }
            $expected = $Matches[1]
            $file = $Matches[2]
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) {
              throw "SHA256 mismatch: $file"
            }
          }
          ./xpotato-tunnel.exe version
          if ($LASTEXITCODE -ne 0) { throw 'version command failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/package/content/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux'
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/package/*.tar.gz
            dist/package/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload release candidate (no publishing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ steps.package.outputs.name }}
          path: |
            dist/release/*.zip
            dist/release/*.tar.gz
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 14
  activity-tests:
    name: Node 24 / ${{ matrix.os }} activity
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --check internal/managed/assets/stdio.mjs
      - run: node --check internal/managed/assets/activity.mjs
      - run: node --check internal/managed/assets/licensing.mjs
      - run: node --test test/activity.test.mjs test/licensing.test.mjs
