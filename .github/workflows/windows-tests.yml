name: Windows checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/windows-tunnel-cli]
permissions:
  contents: read
jobs:
  windows-tests:
    name: Node 24 / Windows fixtures
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
