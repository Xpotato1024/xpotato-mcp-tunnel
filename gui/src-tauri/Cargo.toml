[package]
name = "xpotato-tunnel-app"
version = "0.2.11"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
# Non-distributable hosted Windows harness; default production builds omit it.
native-fixture = []

[build-dependencies]
tauri-build = "=2.7.3"
sha2 = "=0.10.9"

[dependencies]
tauri = { version = "=2.12.4", features = ["custom-protocol"] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
zeroize = "=1.8.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
